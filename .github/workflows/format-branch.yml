name: Format branch with Oxfmt

on:
  push:
    branches:
      - chore/monorepo-foundation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/monorepo-foundation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Format with Oxfmt 0.2.0
        run: npx --yes oxfmt@0.2.0 .

      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AppShell.tsx vite.config.ts
          git commit -m "fix: apply oxfmt formatting"
          git push origin chore/monorepo-foundation
